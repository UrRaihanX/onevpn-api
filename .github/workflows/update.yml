name: Update OneVPN Servers

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Fetch and Check VPN Servers
        run: python fetch_servers.py

      - name: Save servers.json
        run: |
          git config --global user.name "OneVPN Bot"
          git config --global user.email "bot@onevpn.local"
          git add servers.json
          git diff --staged --quiet || git commit -m "Auto-update OneVPN servers"
          git push
