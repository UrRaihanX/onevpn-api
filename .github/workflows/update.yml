name: Update OneVPN Servers

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-onevpn-servers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Collect profiles with Axios and Cheerio
        env:
          NODE_CANDIDATES_FILE: node_candidates.json
          MAX_IPSPEED_PROFILES: '6'
          PUBLICVPNLIST_API_URL: ${{ secrets.PUBLICVPNLIST_API_URL }}
          PUBLICVPNLIST_API_KEY: ${{ secrets.PUBLICVPNLIST_API_KEY }}
          PUBLICVPNLIST_MIRROR_AUTHORIZED: ${{ vars.PUBLICVPNLIST_MIRROR_AUTHORIZED }}
          HUNTVPN_FEED_URL: ${{ secrets.HUNTVPN_FEED_URL }}
          HUNTVPN_FEED_TOKEN: ${{ secrets.HUNTVPN_FEED_TOKEN }}
          HUNTVPN_MIRROR_AUTHORIZED: ${{ vars.HUNTVPN_MIRROR_AUTHORIZED }}
        run: npm run collect

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Fetch and Check VPN Servers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OUTPUT_DIR: dist
          DATA_BRANCH: data
        run: python fetch_servers.py

      - name: Publish single-commit data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ ! -f dist/servers_meta.json ]; then
            echo "Safety guard triggered; keeping existing data branch untouched."
            exit 0
          fi

          cd dist
          git init -b data
          git config user.name "OneVPN Bot"
          git config user.email "bot@onevpn.local"
          git add servers_meta.json servers.json configs/
          git commit -m "Auto-update OneVPN servers"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin data

      - name: Purge jsDelivr CDN cache
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ ! -f dist/servers_meta.json ]; then
            exit 0
          fi
          curl -fsSL "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/servers_meta.json" || true
          curl -fsSL "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/servers.json" || true
