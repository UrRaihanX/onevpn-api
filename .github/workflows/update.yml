name: Update OneVPN Servers

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-onevpn-servers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m py_compile fetch_servers.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Fetch and Check VPN Servers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OUTPUT_DIR: dist
          DATA_BRANCH: data
        run: python fetch_servers.py

      - name: Publish single-commit data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ ! -f dist/servers_meta.json ]; then
            echo "Safety guard triggered; keeping existing data branch untouched."
            exit 0
          fi

          cd dist
          git init -b data
          git config user.name "OneVPN Bot"
          git config user.email "bot@onevpn.local"
          git add servers_meta.json servers.json configs/
          git commit -m "Auto-update OneVPN servers"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin data

      - name: Purge jsDelivr CDN cache
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ ! -f dist/servers_meta.json ]; then
            exit 0
          fi
          curl -fsSL "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/servers_meta.json" || true
          curl -fsSL "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/servers.json" || true
          jq -r '.servers[].config_path' dist/servers_meta.json | xargs -r -P 8 -I {} curl -fsSL --max-time 10 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/{}" -o /dev/null || true
