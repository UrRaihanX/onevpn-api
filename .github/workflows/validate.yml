name: Validate OneVPN Collector

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile collector
        run: python -m py_compile fetch_servers.py
      - name: Run provider publishing tests
        run: python -m unittest discover -s tests -v
